<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>점심 딸깍 · 근처 밥집 한 곳 뽑기</title>
<style>
:root{--paper:#f7e3a7;--ink:#160f0a;--red:#ef4323;--blue:#81caec;--green:#93d8a8;--yellow:#ffc42b;--cream:#fffaf0;--line:rgba(45,35,20,.13)}*{box-sizing:border-box}html,body{margin:0}body{font-family:"Arial Black","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}.wrap{width:min(760px,calc(100% - 24px));margin:auto;padding:18px 0 34px}.top{display:flex;justify-content:space-between;align-items:center;font-size:13px}.link{border-bottom:3px solid var(--ink);font-weight:900}.pill{background:var(--ink);color:var(--yellow);padding:8px 15px;border-radius:13px;transform:rotate(2deg);font-weight:900}.hero{padding:28px 0 18px}.hero h1{font-size:clamp(36px,8vw,62px);line-height:1.04;letter-spacing:-.07em;margin:0 0 15px}.hero p{font-family:"Malgun Gothic";font-weight:700;margin:0;color:#3f3429}.iconbox{display:inline-flex;gap:6px;padding:9px;border:5px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);background:#fff;margin-right:12px;vertical-align:middle;transform:rotate(-3deg)}.iconbox span{background:#fff4e8;border:2px solid var(--ink);border-radius:5px;padding:4px}.card,.footer{background:var(--cream);border:4px solid var(--ink);border-radius:17px;box-shadow:6px 7px 0 var(--ink)}.card{padding:16px;margin:18px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-family:"Malgun Gothic";font-size:12px;font-weight:700}.loc{font-size:14px}.change{font-size:12px;border-bottom:2px solid var(--ink);cursor:pointer}.range{width:100%;accent-color:var(--red)}.labels{display:flex;justify-content:space-between;font-family:"Malgun Gothic";font-size:11px;font-weight:700}.quickline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.distance-badge{background:var(--yellow);border:4px solid var(--ink);border-radius:12px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink);font-size:13px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.seg{display:flex;border:4px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}.seg button{border:0;border-right:3px solid var(--ink);padding:10px 14px;background:#fff;font-weight:900}.seg button:last-child{border-right:0}.seg button.on{background:var(--yellow)}.switch{display:flex;align-items:center;gap:8px;background:#fff;border:4px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:12px}.toggle{width:41px;height:22px;border:3px solid var(--ink);border-radius:999px;background:#fff;position:relative}.toggle:after{content:"";width:13px;height:13px;border:2px solid var(--ink);border-radius:50%;background:#fff;position:absolute;top:1px;left:2px;transition:.15s}.switch.on .toggle{background:var(--green)}.switch.on .toggle:after{left:20px}.big{width:100%;border:4px solid var(--ink);border-radius:15px;box-shadow:7px 8px 0 var(--ink);padding:22px 14px;font-size:23px;font-weight:900;cursor:pointer;margin:14px 0}.big.red{background:var(--red);color:#fff}.big.blue{background:var(--blue)}.select{width:100%;border:4px solid var(--ink);border-radius:15px;background:#fff;padding:14px;font-weight:900;box-shadow:4px 5px 0 var(--ink);margin-top:12px}.result{display:none}.result.show{display:block}.pick{background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:6px 7px 0 var(--ink);padding:18px;margin:16px 0}.pick h2{font-size:30px;letter-spacing:-.04em;margin:0 0 9px}.meta{font-family:"Malgun Gothic";font-size:13px;font-weight:700;line-height:1.7}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.actions a,.actions button{border:3px solid var(--ink);border-radius:11px;padding:11px;background:#fff;font-weight:900;text-align:center;text-decoration:none;color:inherit;cursor:pointer}.actions .again{background:var(--yellow)}.footer{margin-top:28px;padding:17px;font-family:"Malgun Gothic";font-size:11px;line-height:1.75}.loading{display:none;text-align:center;font-family:"Malgun Gothic";font-weight:700}.loading.show{display:block}.error{background:#fff1f0;border:3px solid var(--ink);padding:12px;border-radius:12px;margin-top:10px;font-family:"Malgun Gothic";font-size:12px;font-weight:700}@media(max-width:560px){.hero h1{font-size:39px}.iconbox{display:flex;width:max-content;margin-bottom:13px}.seg{width:100%}.seg button{flex:1;padding:9px 7px}.switch{flex:1;justify-content:center}.actions{grid-template-columns:1fr}.big{font-size:20px}}
</style></head><body><main class="wrap">
<div class="top"><span class="link">← kwonoyoung.github.io/lunch</span><span class="pill">점심 딸깍</span></div>
<section class="hero"><h1><span class="iconbox"><span>🍜</span><span>🍱</span><span>🍣</span></span>근처 밥집,<br>한 곳만 뽑아줘요</h1><p>지금 여기 근처에서 TMAP 장소 검색 결과 중 한 곳만 골라드려요.</p></section>
<section class="card"><div class="row"><div class="loc">📍 <b id="locText">현재 위치를 확인해 주세요</b></div><span class="change" id="locBtn">현재 위치</span></div><hr style="border:0;border-top:3px solid var(--ink);margin:14px 0"><div class="quickline"><b>검색 반경</b><span class="distance-badge"><span id="radiusText">1km</span> 전선 변경</span></div><input id="radius" class="range" type="range" min="300" max="2000" step="100" value="1000"><div class="labels"><span>300m</span><span>1km</span><span>2km</span></div></section>
<div class="controls"><div class="seg" id="meal"><button data-v="점심" class="on">🌞 점심</button><button data-v="저녁">🌙 저녁</button><button data-v="커피">☕ 커피</button></div><div class="switch" id="openOnly"><span class="toggle"></span><b>뽑기: 영업 중만</b></div></div>
<button class="big red" id="pickBtn">🎲 한 곳 뽑기<br><span class="small">무작위예요. 마음에 안 들면 다시 뽑아요.</span></button>
<button class="big blue" id="expenseBtn">🏛️ 업무추진비 결제 순위<br><span class="small">기능 준비중 · 추후 공공데이터 연동 가능</span></button>
<select id="genre" class="select"><option value="">더 고르기 · 음식 종류 전체</option><option>한식</option><option>일식</option><option>중식</option><option>양식</option><option>분식</option><option>고기</option><option>카페</option></select>
<div id="loading" class="loading">TMAP에서 근처 장소를 찾는 중…</div><div id="error"></div>
<section id="result" class="result"><article class="pick"><div class="small">오늘 한 곳은 여기 👇</div><h2 id="name"></h2><div id="meta" class="meta"></div><div class="actions"><a id="tmapLink" target="_blank" rel="noopener">TMAP에서 보기</a><a id="naverLink" target="_blank" rel="noopener">네이버지도 검색</a><button class="again" id="againBtn">🎲 다시 뽑기</button><button id="copyBtn">주소 복사</button></div></article></section>
<section class="footer"><b>정보 출처</b><p>음식점: TMAP 장소 검색 API<br>현재 위치: 브라우저 위치 권한</p><p>실제 영업시간·휴무·메뉴는 방문 전 지도 서비스에서 다시 확인해 주세요.</p></section>
</main><script>
const WORKER_URL='https://lunch-tmap-proxy.kwonoyoung77.workers.dev';
const S={lat:null,lon:null,radius:1000,meal:'점심',openOnly:false,places:[],current:null};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function err(t=''){ $('#error').innerHTML=t?`<div class="error">${t}</div>`:''}function km(v){return v>=1000?(v/1000).toFixed(v%1000?1:0)+'km':v+'m'}
$('#radius').oninput=e=>{S.radius=+e.target.value;$('#radiusText').textContent=km(S.radius)};$$('#meal button').forEach(b=>b.onclick=()=>{$$('#meal button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.meal=b.dataset.v});$('#openOnly').onclick=()=>{$('#openOnly').classList.toggle('on');S.openOnly=$('#openOnly').classList.contains('on')};
function locate(){err();navigator.geolocation.getCurrentPosition(p=>{S.lat=p.coords.latitude;S.lon=p.coords.longitude;$('#locText').textContent=`현재 위치 · 직선 반경 ${km(S.radius)}`},()=>err('현재 위치 권한을 허용해 주세요.'),{enableHighAccuracy:true,timeout:10000})}$('#locBtn').onclick=locate;
async function search(){if(!S.lat||!S.lon){locate();return}$('#loading').classList.add('show');err();try{const u=new URL(WORKER_URL+'/pois');u.searchParams.set('lat',S.lat);u.searchParams.set('lon',S.lon);u.searchParams.set('radius',S.radius);u.searchParams.set('meal',S.meal);if($('#genre').value)u.searchParams.set('genre',$('#genre').value);const r=await fetch(u);if(!r.ok)throw new Error('TMAP 조회 실패 '+r.status);const d=await r.json();S.places=d.places||[];if(!S.places.length)throw new Error('조건에 맞는 장소를 찾지 못했습니다. 반경을 넓혀보세요.');pick()}catch(e){err(e.message)}finally{$('#loading').classList.remove('show')}}
function pick(){if(!S.places.length)return search();const p=S.places[Math.floor(Math.random()*S.places.length)];S.current=p;$('#name').textContent=p.name||'이름 없음';$('#meta').innerHTML=`${p.category?`🍽️ ${p.category}<br>`:''}${p.distance!=null?`📏 약 ${Math.round(p.distance)}m<br>`:''}${p.address?`📍 ${p.address}`:''}`;$('#tmapLink').href=p.tmapUrl;$('#naverLink').href=`https://map.naver.com/p/search/${encodeURIComponent((p.name||'')+' '+(p.address||''))}`;$('#result').classList.add('show')}
$('#pickBtn').onclick=search;$('#againBtn').onclick=pick;$('#copyBtn').onclick=async()=>{if(S.current?.address){await navigator.clipboard.writeText(S.current.address);alert('주소를 복사했습니다.')}};locate();
</script></body></html>
